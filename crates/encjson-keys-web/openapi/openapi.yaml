openapi: 3.0.3
info:
  title: encjson-keys-web UI API
  version: 0.1.0
servers:
  - url: /
paths:
  /api/v1/ui/me:
    get:
      summary: Current user/session context
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/ui/keys:
    get:
      summary: List keys
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: tenant
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeyItem"
  /api/v1/ui/keys/{public_hex}:
    get:
      summary: Key detail
      parameters:
        - in: path
          name: public_hex
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyItem"
    patch:
      summary: Patch key metadata
      parameters:
        - in: path
          name: public_hex
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyPatch"
      responses:
        "200":
          description: Updated key
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/ui/keys/reencrypt:
    post:
      summary: Re-encrypt non-encrypted private keys
      responses:
        "200":
          description: Reencrypt job result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReencryptResponse"
  /api/v1/ui/bootstrap/import:
    post:
      summary: Bootstrap import key from configured source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapImportRequest"
      responses:
        "200":
          description: Imported key summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapImportResponse"
  /api/v1/ui/requests:
    get:
      summary: List requests
      parameters:
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestItem"
    post:
      summary: Create request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCreate"
      responses:
        "200":
          description: Created request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/ui/requests/{id}/approve:
    post:
      summary: Approve request
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestDecision"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/ui/requests/{id}/reject:
    post:
      summary: Reject request
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestDecision"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/ui/tenants:
    get:
      summary: List tenants
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantItem"
    post:
      summary: Create tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCreate"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/ui/tenants/{name}:
    patch:
      summary: Rename tenant
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantRename"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    delete:
      summary: Delete tenant
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  schemas:
    MeResponse:
      type: object
      properties:
        auth_mode: { type: string }
        subject: { type: string }
        roles:
          type: array
          items: { type: string }
      required: [auth_mode, subject, roles]
    KeyItem:
      type: object
      properties:
        public_hex: { type: string }
        tenant: { type: string }
        status: { type: string }
        note: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        legacy_mode: { type: boolean }
        pair_consistent: { type: boolean }
        legacy_reason: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }
      required: [public_hex, tenant, status, tags, legacy_mode, pair_consistent, created_at, updated_at]
    KeyPatch:
      type: object
      properties:
        tenant: { type: string }
        status: { type: string }
        note: { type: string }
        tags:
          type: array
          items: { type: string }
    RequestItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        public_hex: { type: string }
        tenant: { type: string }
        note: { type: string }
        tags:
          type: array
          items: { type: string }
        status: { type: string }
        requested_by: { type: string, nullable: true }
        requested_at: { type: string }
      required: [id, public_hex, tenant, note, tags, status, requested_at]
    RequestCreate:
      type: object
      properties:
        public_hex: { type: string }
        private_hex: { type: string }
        tenant: { type: string }
        note: { type: string }
        tags:
          type: array
          items: { type: string }
      required: [public_hex, private_hex, tenant, note]
    RequestDecision:
      type: object
      properties:
        tenant: { type: string }
        status: { type: string }
        note: { type: string }
        tags:
          type: array
          items: { type: string }
    TenantItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        created_at: { type: string }
      required: [id, name, created_at]
    TenantCreate:
      type: object
      properties:
        name: { type: string }
      required: [name]
    TenantRename:
      type: object
      properties:
        name: { type: string }
      required: [name]
    ReencryptResponse:
      type: object
      properties:
        updated: { type: integer, format: int64 }
      required: [updated]
    BootstrapImportRequest:
      type: object
      properties:
        tenant: { type: string }
        env: { type: string }
        status: { type: string }
        note: { type: string }
      required: [tenant, env]
    BootstrapImportResponse:
      type: object
      properties:
        public_hex: { type: string }
        tenant: { type: string }
        env: { type: string }
        status: { type: string }
        note: { type: string }
        tags:
          type: array
          items: { type: string }
      required: [public_hex, tenant, env, status, note, tags]
